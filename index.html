<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>二択式ランキングメーカー</title>
  <meta name="description" content="画像を二択で比べ続けて、レートで好きな順位を作るツール。画像はブラウザ内だけに保存されます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ================================================================
       色とフォント
       ================================================================ */
    :root {
      --bg:      #F8F8FB;  /* 背景 */
      --surface: #FFFFFF;  /* カードやパネル */
      --ink:     #1A1C24;  /* 本文 */
      --sub:     #5A6072;  /* 補足の文字 */
      --line:    #D9DCE6;  /* 枠線 */
      --blue:    #0017C1;  /* 強調・主ボタン */
      --red:     #CE0000;  /* 削除系 */
      --on-blue: #FFFFFF;  /* 青の上の文字 */

      --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ダークモード：端末がダークモードのときだけ使われる */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12141B; --surface: #1C1F29; --ink: #ECEEF4; --sub: #A3A9BA;
        --line: #2E3242; --blue: #5C74FF; --red: #FF5C5C; --on-blue: #FFFFFF;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12141B; --surface: #1C1F29; --ink: #ECEEF4; --sub: #A3A9BA;
      --line: #2E3242; --blue: #5C74FF; --red: #FF5C5C; --on-blue: #FFFFFF;
    }

    /* ================================================================
       全体
       ================================================================ */
    *, *::before, *::after { box-sizing: inherit; }

    html {
      font-size: 17px;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 700;
      line-height: 1.6;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    /* ================================================================
       見出しとツールバー
       ================================================================ */
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 7vw, 2.6rem);
      line-height: 1.25;
      white-space: nowrap;  /* 名称は必ず1行 */
    }

    h2 {
      margin: 32px 0 0;
      font-size: 1.2rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      padding: 8px 16px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font-size: 1rem;
      cursor: pointer;
    }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
    .btn.danger  { background: var(--red); border-color: var(--red); color: var(--on-blue); }
    .btn:disabled { opacity: .45; cursor: default; }

    .note {
      margin: 8px 0 0;
      color: var(--sub);
      font-size: .9rem;
    }

    /* ================================================================
       画像がないときの案内
       ================================================================ */
    .empty {
      margin-top: 20px;
      padding: 44px 16px;
      border: 2px dashed var(--line);
      border-radius: 14px;
      color: var(--sub);
      text-align: center;
    }
    body.dragging main {
      outline: 3px dashed var(--blue);
      outline-offset: 4px;
    }

    /* ================================================================
       二択の比較画面
       ================================================================ */
    .arena {
      margin-top: 20px;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .arena-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      color: var(--sub);
      font-size: .9rem;
    }

    .focusbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 8px 12px;
      border: 2px solid var(--blue);
      border-radius: 10px;
      background: var(--bg);
      font-size: .95rem;
    }
    .focusbar img { width: 38px; height: 50px; object-fit: cover; border-radius: 4px; }

    .duel {
      display: grid;
      grid-template-columns: minmax(0, 260px) auto minmax(0, 260px);
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .vs { color: var(--sub); font-size: 1.1rem; }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      transition: border-color .15s, transform .08s;
    }
    .card:hover  { border-color: var(--blue); }
    .card:active { transform: scale(.98); }
    .card img {
      display: block;
      width: 100%;
      max-height: 42vh;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      border-radius: 8px;
      background: var(--surface);
    }
    .card .name { font-size: 1rem; text-align: center; overflow-wrap: anywhere; }
    .card .power { color: var(--sub); font-size: .85rem; text-align: center; }

    .arena-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    /* ================================================================
       順位一覧
       ================================================================ */
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .item {
      position: relative;
      min-width: 0;
      padding: 6px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }
    .item.focused { border-color: var(--blue); }
    .item img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 6px;
    }
    .item .name { margin-top: 3px; font-size: .8rem; overflow-wrap: anywhere; }
    .item .meta { color: var(--sub); font-size: .68rem; }

    .rank {
      position: absolute;
      top: 3px;
      left: 3px;
      min-width: 22px;
      padding: 0 5px;
      border-radius: 5px;
      background: var(--blue);
      color: var(--on-blue);
      font-size: .8rem;
      text-align: center;
    }

    .item-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 4px;
    }
    .item-actions button {
      padding: 3px 2px;
      border: 2px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: .72rem;
      cursor: pointer;
    }
    .item-actions .danger { color: var(--red); }
    .item-actions .wide   { grid-column: 1 / -1; }
    .item-actions .move   { font-weight: 700; }

    @media (max-width: 480px) {
      .duel { gap: 6px; }
      .vs { font-size: .9rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:active { transform: none; }
    }
  </style>
</head>

<body>
<main>

  <header>
    <h1>二択式ランキングメーカー</h1>
    <div class="toolbar">
      <button class="btn primary" id="addBtn">画像を追加</button>
      <button class="btn" id="undoBtn" disabled>Undo</button>
      <button class="btn" id="exportBtn">保存</button>
      <button class="btn" id="importBtn">読み込み</button>
      <button class="btn" id="sampleBtn" hidden>サンプル</button>
      <button class="btn" id="sheetBtn">シート作成</button>
      <button class="btn danger" id="resetBtn">すべて削除</button>
    </div>
  </header>

  <p class="note" id="status"></p>
  <p class="note">画像と順位はこのブラウザの中だけに保存され、どこにも送信されません。<br>「保存」で画像と順位をまとめて1つのファイルに書き出し、「読み込み」で復元できます。</p>

  <input type="file" id="imageInput" accept="image/*" multiple hidden>
  <input type="file" id="importInput" accept=".json,application/json" hidden>

  <div class="empty" id="empty" hidden>
    画像を選ぶか、ここにドラッグ＆ドロップすると二択が始まります。<br>
    新しい画像はまず4回の配置比較で大まかな位置を決め、その後はレートで順位が変わっていきます。
  </div>

  <section class="arena" id="arena" hidden>
    <div class="arena-top">
      <span>好きなほうを選んでください。← → で選択、↓ で同じくらい、S でスキップ、Z で Undo</span>
      <span id="stability"></span>
    </div>

    <div class="focusbar" id="focusbar" hidden>
      <img alt="">
      <span></span>
    </div>

    <div class="duel">
      <button class="card" id="leftCard">
        <img alt="">
        <span class="name"></span>
        <span class="power"></span>
      </button>
      <div class="vs">VS</div>
      <button class="card" id="rightCard">
        <img alt="">
        <span class="name"></span>
        <span class="power"></span>
      </button>
    </div>

    <div class="arena-actions">
      <button class="btn" id="tieBtn">同じくらい</button>
      <button class="btn" id="skipBtn">スキップ</button>
      <button class="btn" id="powerBtn">強さを隠す</button>
    </div>
  </section>

  <h2 id="listTitle" hidden></h2>
  <ol class="list" id="list"></ol>

</main>

<script>
/* ==================================================================
   設定値
   ================================================================== */
const RATING_START   = 1500;  // 最初の画像のレート
const RD_START       = 350;   // 新しい画像の信頼幅（最大値）
const RD_MIN         = 50;    // 信頼幅の下限
const RD_GROWTH      = 25;    // 比較されない間に信頼幅が広がる速さ
const PLACEMENT_N    = 4;     // 新しい画像の配置比較の回数
const FOCUS_N        = 10;    // 集中比較の回数
const FOCUS_FAR_N    = 6;     // うち、レートが少し離れた相手と比べる回数
const HISTORY_MAX    = 300;   // Undo で戻れる回数
const STABILITY_SPAN = 20;    // 順位変動を測る直近の比較数
const IMAGE_ASPECT   = 3 / 4; // 保存する画像の縦横比（幅 / 高さ）。表の1マスと同じ比率に揃える
const IMAGE_HEIGHT   = 640;   // 保存する画像の高さ(px)。幅は IMAGE_ASPECT から決まる
const Q = Math.LN10 / 400;    // Glicko の定数
const SAMPLE_DIR     = "samples/";  // サンプル画像のフォルダ。中の samples.json に一覧を書く

/* ==================================================================
   状態
   ratings[id] = { r: レート, rd: 信頼幅, n: 比較回数,
                   p: 残りの配置比較回数, last: 最後に比較した時点 }
   t    : これまでの比較の総数（時間の代わりに使う）
   hist : Undo 用の履歴 { a, b, res, before }
   ================================================================== */
const emptyState = () => ({ version: 3, names: {}, ratings: {}, t: 0, hist: [] });

let state     = emptyState();
let pair      = null;   // いま表示している2枚 [左, 右]
let lastKey   = "";     // 直前の組（同じ組が続かないように）
let focus     = null;   // 集中比較 { id, left, used }
let showPower = true;   // 比較画面に強さを表示するか
let storageOK = true;
const urls    = {};     // 画像id → 表示用URL

const $ = id => document.getElementById(id);
const allIds = () => Object.keys(state.ratings);
const pickRandom = list => list[Math.floor(Math.random() * list.length)];
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
const newId = () => "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const mean = list => (list.length ? list.reduce((s, x) => s + x, 0) / list.length : RATING_START);

/* ==================================================================
   ブラウザ内の保存（IndexedDB）
   ================================================================== */
const dbReady = new Promise(resolve => {
  try {
    const req = indexedDB.open("pairsort", 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore("images", { keyPath: "id" });
      req.result.createObjectStore("kv");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => resolve(null);
  } catch (e) {
    resolve(null);
  }
});

async function db(storeName, mode, operation) {
  const database = await dbReady;
  if (!database) { storageOK = false; return undefined; }
  return new Promise(resolve => {
    try {
      const tx = database.transaction(storeName, mode);
      const req = operation(tx.objectStore(storeName));
      let result;
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror    = () => { storageOK = false; resolve(undefined); };
    } catch (e) {
      storageOK = false;
      resolve(undefined);
    }
  });
}

const saveState = () => db("kv", "readwrite", s => s.put(JSON.parse(JSON.stringify(state)), "state"));

/* 画像を IMAGE_ASPECT の縦横比に中央でトリミングしてから、
   幅・高さとも一定のサイズに縮小して JPEG にする。
   すべての画像がここで同じ縦横比・同じ寸法になるので、
   一覧やTier表シートでの見え方が画像ごとにばらつかない */
async function shrinkImage(file) {
  try {
    const bitmap = await createImageBitmap(file);
    const srcAspect = bitmap.width / bitmap.height;

    // まず IMAGE_ASPECT に合わせて元画像から切り出す範囲を決める
    let sx = 0, sy = 0, sw = bitmap.width, sh = bitmap.height;
    if (srcAspect > IMAGE_ASPECT) {
      sw = Math.round(bitmap.height * IMAGE_ASPECT);
      sx = Math.round((bitmap.width - sw) / 2);
    } else if (srcAspect < IMAGE_ASPECT) {
      sh = Math.round(bitmap.width / IMAGE_ASPECT);
      sy = Math.round((bitmap.height - sh) / 2);
    }

    const canvas = document.createElement("canvas");
    canvas.height = IMAGE_HEIGHT;
    canvas.width  = Math.round(IMAGE_HEIGHT * IMAGE_ASPECT);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return await new Promise(r => canvas.toBlob(b => r(b || file), "image/jpeg", 0.88));
  } catch (e) {
    return file;
  }
}

/* ==================================================================
   レート計算（Glicko 方式）
   ================================================================== */

/* しばらく比較されていない画像は信頼幅が広がる。
   1期間 = 各画像が平均して1回比較されるまでの比較数 */
function currentRD(item) {
  const period  = Math.max(1, allIds().length / 2);
  const elapsed = (state.t - item.last) / period;
  return Math.min(RD_START, Math.sqrt(item.rd ** 2 + RD_GROWTH ** 2 * elapsed));
}

const gFactor = rd => 1 / Math.sqrt(1 + 3 * Q * Q * rd * rd / (Math.PI * Math.PI));

/* レート ra の側がレート rb の相手に勝つ予想確率 */
const expectedWin = (ra, rb) => 1 / (1 + Math.pow(10, -(ra - rb) / 400));

/* 1回分の結果でレートを更新する。scoreA は a から見た得点（勝ち1, 引き分け0.5, 負け0） */
function applyResult(a, b, scoreA) {
  const A = state.ratings[a], B = state.ratings[b];
  const rdA = currentRD(A), rdB = currentRD(B);

  const updateOne = (r, rd, rOpp, rdOpp, score) => {
    const g = gFactor(rdOpp);
    const E = 1 / (1 + Math.pow(10, -g * (r - rOpp) / 400));
    const d2 = 1 / (Q * Q * g * g * E * (1 - E));
    const denom = 1 / (rd * rd) + 1 / d2;
    return { r: r + (Q / denom) * g * (score - E), rd: Math.max(RD_MIN, Math.sqrt(1 / denom)) };
  };

  const nextA = updateOne(A.r, rdA, B.r, rdB, scoreA);
  const nextB = updateOne(B.r, rdB, A.r, rdA, 1 - scoreA);

  for (const [item, next] of [[A, nextA], [B, nextB]]) {
    item.r = next.r;
    item.rd = next.rd;
    item.n++;
    item.last = state.t + 1;
    if (item.p > 0) item.p--;
  }
  state.t++;
}

/* ==================================================================
   出題（次の2枚を選ぶ）
   ================================================================== */

/* 画像 a から見た予想勝率が [low, high] に入る相手の候補。
   該当がなければ、レートが近い順に3枚を返す */
function findOpponents(a, low, high, exclude = []) {
  const A = state.ratings[a];
  const others = allIds().filter(b => b !== a && !exclude.includes(b) && pairKey(a, b) !== lastKey);
  const inRange = others.filter(b => {
    const e = expectedWin(A.r, state.ratings[b].r);
    return e >= low && e <= high;
  });
  if (inRange.length) return inRange;
  return others
    .sort((x, y) => Math.abs(state.ratings[x].r - A.r) - Math.abs(state.ratings[y].r - A.r))
    .slice(0, 3);
}

const shuffleSides = ([a, b]) => (Math.random() < 0.5 ? [a, b] : [b, a]);

/* 集中比較：前半はレートが少し離れた相手（格上と格下を交互に）、後半は近い相手。
   対象の画像は常に左に置く */
function pickFocusPair() {
  const a = focus.id, A = state.ratings[a];
  const done = FOCUS_N - focus.left;
  let candidates;

  if (done < FOCUS_FAR_N) {
    const stronger = findOpponents(a, 0.15, 0.35, focus.used).filter(b => state.ratings[b].r > A.r);
    const weaker   = findOpponents(a, 0.65, 0.85, focus.used).filter(b => state.ratings[b].r < A.r);
    const preferStronger = done % 2 === 0;
    candidates = preferStronger ? (stronger.length ? stronger : weaker) : (weaker.length ? weaker : stronger);
    if (!candidates.length) candidates = findOpponents(a, 0.15, 0.35, focus.used);
  } else {
    candidates = findOpponents(a, 0.4, 0.6, focus.used);
  }

  const b = pickRandom(candidates);
  focus.used.push(b);
  return [a, b];
}

function pickPair() {
  const ids = allIds();
  if (ids.length < 2) return null;

  if (focus && state.ratings[focus.id]) return pickFocusPair();

  // 配置比較が残っている画像を優先。相手は予想勝率20〜80%の幅広い範囲から
  const placing = ids.filter(id => state.ratings[id].p > 0);
  if (placing.length && placing.length < ids.length) {
    const a = pickRandom(placing);
    const placed = findOpponents(a, 0.2, 0.8).filter(b => state.ratings[b].p === 0);
    const b = placed.length ? pickRandom(placed) : pickRandom(findOpponents(a, 0.2, 0.8));
    return shuffleSides([a, b]);
  }

  // 通常：信頼幅の2乗に比例する確率で対象を選び、相手は予想勝率30〜70%からランダム
  const weights = ids.map(id => currentRD(state.ratings[id]) ** 2);
  let u = Math.random() * weights.reduce((s, w) => s + w, 0);
  let a = ids[0];
  for (let i = 0; i < ids.length; i++) {
    u -= weights[i];
    if (u <= 0) { a = ids[i]; break; }
  }
  return shuffleSides([a, pickRandom(findOpponents(a, 0.3, 0.7))]);
}

/* ==================================================================
   操作
   ================================================================== */
const RESULT = { LEFT: 0, RIGHT: 1, TIE: 2, SKIP: 3 };

function answer(result) {
  if (!pair) return;
  const [left, right] = pair;
  lastKey = pairKey(left, right);

  if (result !== RESULT.SKIP) {
    const before = { [left]: { ...state.ratings[left] }, [right]: { ...state.ratings[right] } };
    const scoreLeft = result === RESULT.LEFT ? 1 : result === RESULT.RIGHT ? 0 : 0.5;
    applyResult(left, right, scoreLeft);
    state.hist.push({ a: left, b: right, res: result, before });
    if (state.hist.length > HISTORY_MAX) state.hist.shift();
  }

  if (focus && pair.includes(focus.id)) {
    focus.left--;
    if (focus.left <= 0) focus = null;
  }
  pair = null;
  saveState();
  render();
}

/* 順位を1つだけ手動で入れ替える。dir は -1（前へ）か +1（後ろへ） */
function moveRank(id, dir) {
  const ranking = makeRanking();
  const pos = ranking.rank[id];
  const targetPos = pos + dir;
  if (targetPos < 0 || targetPos >= ranking.order.length) return;
  const otherId = ranking.order[targetPos];

  const before = { [id]: { ...state.ratings[id] }, [otherId]: { ...state.ratings[otherId] } };
  const swapR = state.ratings[id].r;
  state.ratings[id].r = state.ratings[otherId].r;
  state.ratings[otherId].r = swapR;

  state.hist.push({ type: "swap", a: id, b: otherId, before });
  if (state.hist.length > HISTORY_MAX) state.hist.shift();
  saveState();
  render(true);
}

function undo() {
  const last = state.hist.pop();
  if (!last) return;

  // 手動の順位入れ替えを戻す場合
  if (last.type === "swap") {
    for (const id in last.before) if (state.ratings[id]) state.ratings[id] = last.before[id];
    saveState();
    render(true);
    return;
  }

  for (const id in last.before) {
    if (state.ratings[id]) state.ratings[id] = last.before[id];
  }
  state.t = Math.max(0, state.t - 1);

  if (state.ratings[last.a] && state.ratings[last.b]) {
    pair = [last.a, last.b];
    if (focus && pair.includes(focus.id)) {
      focus.left++;
      focus.used.pop();
      if (pair[0] !== focus.id) pair.reverse();
    }
  } else {
    pair = null;
  }
  saveState();
  render(true);
}

async function addImages(files) {
  const images = [...files].filter(f => f.type.startsWith("image/"));
  if (!images.length) return;
  showMessage("読み込み中…");

  const isFirst = allIds().length === 0;
  const startRating = mean(allIds().map(id => state.ratings[id].r));

  for (const file of images) {
    const blob = await shrinkImage(file);
    const id = newId();
    urls[id] = URL.createObjectURL(blob);
    await db("images", "readwrite", s => s.put({ id, blob }));
    state.names[id] = file.name.replace(/\.[^.]+$/, "");
    state.ratings[id] = { r: startRating, rd: RD_START, n: 0, p: PLACEMENT_N, last: state.t };
  }
  // 最初の1枚だけのときは比べる相手がいないので、配置比較なしで置く
  if (isFirst && images.length === 1) state.ratings[allIds()[0]].p = 0;

  message = "";
  pair = null;
  saveState();
  render();
}

function deleteImage(id) {
  delete state.ratings[id];
  delete state.names[id];
  state.hist = state.hist.filter(h => h.a !== id && h.b !== id);
  db("images", "readwrite", s => s.delete(id));
  if (urls[id]) URL.revokeObjectURL(urls[id]);
  delete urls[id];
  if (pair && pair.includes(id)) pair = null;
  if (focus && focus.id === id) focus = null;
  saveState();
  render();
}

/* 初期化：画像は残し、レートと記録を新規追加と同じ状態に戻す */
function resetImage(id) {
  const others = allIds().filter(x => x !== id);
  state.ratings[id] = {
    r: mean(others.map(x => state.ratings[x].r)),
    rd: RD_START,
    n: 0,
    p: others.length ? PLACEMENT_N : 0,
    last: state.t,
  };
  state.hist = state.hist.filter(h => h.a !== id && h.b !== id);
  if (pair && pair.includes(id)) pair = null;
  if (focus && focus.id === id) focus = null;
  saveState();
  render();
}

function startFocus(id) {
  focus = { id, left: FOCUS_N, used: [] };
  pair = null;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteAll() {
  Object.values(urls).forEach(u => URL.revokeObjectURL(u));
  for (const k in urls) delete urls[k];
  state = emptyState();
  pair = null;
  focus = null;
  await db("images", "readwrite", s => s.clear());
  saveState();
  render();
}

/* 誤操作防止：1回目はボタンの文字を変えるだけで、一定時間内の2回目で実行する。
   noConfirmNeeded() が true のときは確認せずにすぐ実行する */
function confirmTwice(button, confirmText, action, ms = 3000, noConfirmNeeded = () => false) {
  const original = button.textContent;
  let timer = null;
  button.addEventListener("click", () => {
    if (noConfirmNeeded()) { action(); return; }
    if (!timer) {
      button.textContent = confirmText;
      timer = setTimeout(() => { timer = null; button.textContent = original; }, ms);
      return;
    }
    clearTimeout(timer);
    timer = null;
    button.textContent = original;
    action();
  });
}

/* ==================================================================
   保存ファイルの書き出しと読み込み
   ================================================================== */
const blobToDataURL = blob => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload  = () => resolve(reader.result);
  reader.onerror = reject;
  reader.readAsDataURL(blob);
});

function dataURLToBlob(dataURL) {
  const [meta, base64] = dataURL.split(",");
  const type = (meta.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type });
}

/* claude.ai 上では downloads 機能、通常のサイトではブラウザのダウンロードを使う */
async function downloadFile(filename, blob) {
  const claudeDownloads = window.claude && window.claude.use
    ? await window.claude.use("downloads").catch(() => null)
    : null;
  if (claudeDownloads) {
    await claudeDownloads.save({ filename, data: blob });
    return;
  }
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
}

async function exportData() {
  if (!allIds().length) { showMessage("保存するデータがありません"); return; }
  showMessage("書き出し中…");

  const records = (await db("images", "readonly", s => s.getAll())) || [];
  const images = {};
  for (const rec of records) {
    if (state.ratings[rec.id]) images[rec.id] = await blobToDataURL(rec.blob);
  }

  const d = new Date(), pad = x => String(x).padStart(2, "0");
  const filename = `ranking-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const data = { app: "pairsort", savedAt: d.toISOString(), state, images };

  try {
    await downloadFile(filename, new Blob([JSON.stringify(data)], { type: "application/json" }));
    showMessage("保存しました");
  } catch (e) {
    showMessage(e && e.code === "declined" ? "保存をキャンセルしました" : "保存できませんでした");
  }
}

async function importData(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    showMessage("ファイルを読み込めませんでした");
    return;
  }
  const valid = data && data.app === "pairsort" && data.state && data.state.version === 3 && data.images;
  if (!valid) { showMessage("このツールの保存ファイルではありません"); return; }

  Object.values(urls).forEach(u => URL.revokeObjectURL(u));
  for (const k in urls) delete urls[k];
  await db("images", "readwrite", s => s.clear());

  for (const [id, dataURL] of Object.entries(data.images)) {
    const blob = dataURLToBlob(dataURL);
    urls[id] = URL.createObjectURL(blob);
    await db("images", "readwrite", s => s.put({ id, blob }));
  }

  state = data.state;
  state.hist = state.hist || [];
  cleanUpState();
  pair = null;
  focus = null;
  saveState();
  render();
  showMessage(`${allIds().length}件を読み込みました`);
}

/* 画像のないデータや、存在しない画像を指す履歴を取り除く */
function cleanUpState() {
  for (const id of Object.keys(state.names)) {
    if (!urls[id]) { delete state.names[id]; delete state.ratings[id]; }
  }
  for (const id of Object.keys(state.ratings)) {
    if (!(id in state.names)) delete state.ratings[id];
  }
  state.hist = state.hist.filter(h => state.ratings[h.a] && state.ratings[h.b]);
}


/* ==================================================================
   Tier表シートの書き出し
   横10列、縦は10位ごとの行。各行の左に「Top10」「Top20」…という見出しを付けた
   1枚のPNG画像を作る。強さなどの数値は入れず、画像と順位番号だけを載せる
   ================================================================== */
const SHEET_COLS = 10;
const SHEET_CELL_W = 140, SHEET_CELL_H = 187;
const SHEET_LABEL_W = 110;
const SHEET_LINE = "#3A3A3A";   // 行や列を仕切る線
const SHEET_BG = "#000000";     // 背景
// 見出し欄の色。行の位置（0〜1）を虹の色相（赤→紫、0〜270度）に対応させる
const rowLabelColor = (i, n) => `hsl(${n > 1 ? (i / (n - 1)) * 270 : 0}, 70%, 42%)`;

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* object-fit: cover と同じ考え方で、枠いっぱいに敷き詰めるように描く */
function drawCover(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

async function buildSheet(order) {
  const rowCount = Math.ceil(order.length / SHEET_COLS);
  const width  = SHEET_LABEL_W + SHEET_COLS * SHEET_CELL_W;
  const height = rowCount * SHEET_CELL_H;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = SHEET_BG;
  ctx.fillRect(0, 0, width, height);

  for (let row = 0; row < rowCount; row++) {
    const y = row * SHEET_CELL_H;
    const rowEnd = (row + 1) * SHEET_COLS; // 最後の行が10枚に満たなくても10の倍数で表示する

    // 見出し（Tiermaker の左端のラベル欄と同じ位置づけ）。上から下へ虹色に変化させる
    ctx.fillStyle = rowLabelColor(row, rowCount);
    ctx.fillRect(0, y, SHEET_LABEL_W, SHEET_CELL_H);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 26px 'Zen Kaku Gothic New', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`Top${rowEnd}`, SHEET_LABEL_W / 2, y + SHEET_CELL_H / 2);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    for (let col = 0; col < SHEET_COLS; col++) {
      const rank = row * SHEET_COLS + col;
      if (rank >= order.length) break;
      const id = order[rank];
      const x = SHEET_LABEL_W + col * SHEET_CELL_W;

      try {
        const img = await loadImageElement(urls[id]);
        drawCover(ctx, img, x, y, SHEET_CELL_W, SHEET_CELL_H);
      } catch (e) {
        ctx.fillStyle = "#2A2A2A";
        ctx.fillRect(x, y, SHEET_CELL_W, SHEET_CELL_H);
      }

      // 画像の左上に小さく順位番号
      ctx.fillStyle = "rgba(0,0,0,.65)";
      ctx.fillRect(x, y, 30, 22);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 13px 'Zen Kaku Gothic New', sans-serif";
      ctx.fillText(String(rank + 1), x + 6, y + 16);
    }
  }

  // マス目の線。太さ1pxで、座標を0.5pxずらして引くことで、
  // 線がぼやけたり隣のマスの画像にはみ出したりしないようにする
  ctx.strokeStyle = SHEET_LINE;
  ctx.lineWidth = 1;
  for (let row = 0; row <= rowCount; row++) {
    const y = row * SHEET_CELL_H + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }
  for (let col = 0; col <= SHEET_COLS; col++) {
    const x = SHEET_LABEL_W + col * SHEET_CELL_W + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  { const x = SHEET_LABEL_W + 0.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }

  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

async function exportSheets() {
  const ranking = makeRanking();
  if (!ranking.order.length) { showMessage("画像がありません"); return; }
  showMessage("シートを作成中…");

  const blob = await buildSheet(ranking.order);
  const d = new Date(), pad = x => String(x).padStart(2, "0");
  const filename = `tier-sheet-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.png`;
  try {
    await downloadFile(filename, blob);
    showMessage("シートを書き出しました");
  } catch (e) {
    showMessage("シートを保存できませんでした");
  }
}

/* ==================================================================
   サンプル
   samples/samples.json に [{"file": "01.jpg", "name": "表示名"}, ...] の形で一覧を書く。
   一覧が読めないとき（claude.ai 上やファイル未配置のとき）はボタンを出さない
   ================================================================== */
let sampleList = [];

async function prepareSamples() {
  try {
    const res = await fetch(SAMPLE_DIR + "samples.json", { cache: "no-cache" });
    if (!res.ok) return;
    const list = await res.json();
    if (Array.isArray(list) && list.length) {
      sampleList = list;
      $("sampleBtn").hidden = false;
    }
  } catch (e) {
    // サンプルなしで動かす
  }
}

async function loadSamples() {
  showMessage("サンプルを読み込み中…");
  const files = [];
  for (const entry of sampleList) {
    try {
      const res = await fetch(SAMPLE_DIR + entry.file);
      if (!res.ok) continue;
      const blob = await res.blob();
      const ext = entry.file.match(/\.[^.]+$/)?.[0] || ".jpg";
      files.push(new File([blob], (entry.name || entry.file.replace(/\.[^.]+$/, "")) + ext, { type: blob.type || "image/jpeg" }));
    } catch (e) {
      // 読めない画像は飛ばす
    }
  }
  if (!files.length) { showMessage("サンプルを読み込めませんでした"); return; }
  await deleteAll();
  await addImages(files);
}

/* ==================================================================
   画面の描画
   ================================================================== */
let messageTimer = null;
let message = "";

function showMessage(text) {
  message = text;
  render(true);
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { message = ""; render(true); }, 3000);
}

/* 強さ 0〜100 = 平均的なレートの相手への予想勝率 */
function makeRanking() {
  const ids = allIds();
  const avg = mean(ids.map(id => state.ratings[id].r));
  const order = [...ids].sort((x, y) => state.ratings[y].r - state.ratings[x].r);
  const rank = {};
  order.forEach((id, i) => { rank[id] = i; });
  const toPower = r => Math.round(100 * expectedWin(r, avg));
  return { order, rank, toPower };
}

function powerText(id, ranking) {
  const item = state.ratings[id];
  const rd = currentRD(item);
  const p = ranking.toPower;
  return `強さ ${p(item.r)}（${p(item.r - rd)}〜${p(item.r + rd)}）`;
}

const placementText = item => `配置比較中 ${PLACEMENT_N - item.p}/${PLACEMENT_N}`;

/* 直近 STABILITY_SPAN 回で順位がどれだけ動いたか。履歴を巻き戻した順位と比べる */
function stabilityText(ranking) {
  const ids = allIds(), H = state.hist.length;
  if (H < STABILITY_SPAN || ids.length <= 2) return "";
  const oldRating = {};
  for (const id of ids) oldRating[id] = state.ratings[id].r;
  for (let k = H - 1; k >= H - STABILITY_SPAN; k--) {
    for (const id in state.hist[k].before) {
      if (id in oldRating) oldRating[id] = state.hist[k].before[id].r;
    }
  }
  const oldOrder = [...ids].sort((x, y) => oldRating[y] - oldRating[x]);
  let moved = 0;
  oldOrder.forEach((id, i) => { moved += Math.abs(ranking.rank[id] - i); });
  return `直近${STABILITY_SPAN}回での順位変動 平均${(moved / ids.length).toFixed(1)}位`;
}

function renderStatus() {
  const ids = allIds();
  const placing = ids.filter(id => state.ratings[id].p > 0).length;
  let text = "";
  if (ids.length) {
    text = `登録 ${ids.length}件、比較 ${state.t}回`;
    if (placing) text += `、配置比較中 ${placing}件`;
  }
  if (!storageOK) text += "。この環境では保存できないため、閉じると消えます";
  $("status").textContent = message || text;
}

function renderArena(ranking) {
  $("arena").hidden = !pair;
  if (!pair) return;

  $("stability").textContent = stabilityText(ranking);

  $("focusbar").hidden = !focus;
  if (focus) {
    const phase = FOCUS_N - focus.left < FOCUS_FAR_N ? "レートが少し離れた相手" : "レートが近い相手";
    $("focusbar").querySelector("img").src = urls[focus.id] || "";
    $("focusbar").querySelector("span").textContent =
      `集中比較中：${state.names[focus.id]}（現在${ranking.rank[focus.id] + 1}位）あと${focus.left}回（${phase}）`;
  }

  for (const [card, id] of [[$("leftCard"), pair[0]], [$("rightCard"), pair[1]]]) {
    const item = state.ratings[id];
    card.querySelector("img").src = urls[id] || "";
    card.querySelector("img").alt = state.names[id] || "";
    card.querySelector(".name").textContent = state.names[id] || "";
    card.querySelector(".power").textContent = !showPower ? ""
      : item.p > 0 ? placementText(item)
      : `${powerText(id, ranking)}・${ranking.rank[id] + 1}位`;
  }
  $("powerBtn").textContent = showPower ? "強さを隠す" : "強さを表示";
}

function makeListItem(id, index, ranking) {
  const item = state.ratings[id];
  const li = document.createElement("li");
  li.className = "item" + (focus && focus.id === id ? " focused" : "");

  const badge = document.createElement("div");
  badge.className = "rank";
  badge.textContent = index + 1;

  const img = document.createElement("img");
  img.src = urls[id] || "";
  img.alt = state.names[id] || "";
  img.loading = "lazy";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = state.names[id] || "";

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = item.p > 0 ? placementText(item) : `${powerText(id, ranking)}・比較${item.n}回`;

  const actions = document.createElement("div");
  actions.className = "item-actions";

  const focusBtn = document.createElement("button");
  focusBtn.textContent = "集中";
  focusBtn.addEventListener("click", () => startFocus(id));

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "danger";
  deleteBtn.textContent = "削除";
  deleteBtn.addEventListener("click", () => deleteImage(id));

  const leftBtn = document.createElement("button");
  leftBtn.className = "move";
  leftBtn.textContent = "←";
  leftBtn.title = "ひとつ前の順位に入れ替える";
  leftBtn.disabled = index === 0;
  leftBtn.addEventListener("click", () => moveRank(id, -1));

  const rightBtn = document.createElement("button");
  rightBtn.className = "move";
  rightBtn.textContent = "→";
  rightBtn.title = "ひとつ後ろの順位に入れ替える";
  rightBtn.disabled = index === ranking.order.length - 1;
  rightBtn.addEventListener("click", () => moveRank(id, 1));

  const resetBtn = document.createElement("button");
  resetBtn.className = "wide";
  resetBtn.textContent = "初期化";
  confirmTwice(resetBtn, "もう一度押すと初期化", () => resetImage(id));

  actions.append(focusBtn, deleteBtn, leftBtn, rightBtn, resetBtn);
  li.append(badge, img, name, meta, actions);
  return li;
}

function renderList(ranking) {
  const count = allIds().length;
  $("listTitle").hidden = !count;
  $("listTitle").textContent = `現在の順位（${count}件）`;
  const list = $("list");
  list.textContent = "";
  ranking.order.forEach((id, i) => list.append(makeListItem(id, i, ranking)));
}

/* keepPair が true のときは、表示中の2枚を選び直さない */
function render(keepPair = false) {
  if (!keepPair && (!pair || !pair.every(id => state.ratings[id]))) pair = pickPair();
  const ranking = makeRanking();

  $("undoBtn").disabled = !state.hist.length;
  $("empty").hidden = allIds().length > 0;

  renderStatus();
  renderArena(ranking);
  renderList(ranking);
}

/* ==================================================================
   旧版データの移行
   比較ログから Bradley–Terry モデルで強さを一度だけ推定し、レートの初期値にする
   ================================================================== */
function migrateOldState(saved) {
  const names = saved.names || {};
  let comps = saved.comps;
  if (!comps && saved.ranked) {
    comps = [];
    for (let i = 0; i + 1 < saved.ranked.length; i++) comps.push([saved.ranked[i], saved.ranked[i + 1]]);
  }
  comps = (comps || []).filter(c => c[0] in names && c[1] in names);

  const ids = Object.keys(names);
  const index = {};
  ids.forEach((id, i) => { index[id] = i; });
  const strength = ids.map(() => 1), wins = ids.map(() => 1), count = ids.map(() => 0);

  for (const [a, b, tie] of comps) {
    if (tie) { wins[index[a]] += 0.5; wins[index[b]] += 0.5; } else wins[index[a]]++;
    count[index[a]]++;
    count[index[b]]++;
  }
  for (let iter = 0; iter < 300; iter++) {
    const denom = strength.map(s => 2 / (s + 1));
    for (const [a, b] of comps) {
      const i = index[a], j = index[b], v = 1 / (strength[i] + strength[j]);
      denom[i] += v;
      denom[j] += v;
    }
    for (let i = 0; i < ids.length; i++) strength[i] = wins[i] / denom[i];
  }

  const next = emptyState();
  next.names = names;
  ids.forEach((id, i) => {
    next.ratings[id] = { r: RATING_START + 400 * Math.log10(strength[i]), rd: 200, n: count[i], p: 0, last: 0 };
  });
  return next;
}

/* ==================================================================
   起動
   ================================================================== */
(async () => {
  const saved = await db("kv", "readonly", s => s.get("state"));
  if (saved && saved.version === 3) state = saved;
  else if (saved && saved.names) state = migrateOldState(saved);

  const records = (await db("images", "readonly", s => s.getAll())) || [];
  for (const rec of records) urls[rec.id] = URL.createObjectURL(rec.blob);

  cleanUpState();
  saveState();
  render();
  prepareSamples();
})();
</script>
